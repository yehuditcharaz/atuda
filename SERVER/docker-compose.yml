version: '3.8'
services:

  minio:
      image: quay.io/minio/minio
      container_name: minio
      ports:
        - "9000:9000"
        - "9001:9001"
      environment:
        MINIO_ROOT_USER: minio99
        MINIO_ROOT_PASSWORD: minio123
      command: server /data --console-address ":9001"
      restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:  
      dockerfile: Dockerfile
      context: .
    container_name: server
    volumes:
      - ./src:/app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL
    env_file:
       - ./.env
    depends_on:
      - db
      - minio
    stdin_open: true 
    restart: always

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

volumes:
  pgdata:
