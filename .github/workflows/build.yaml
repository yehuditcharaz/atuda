        # context: ./services/RAG-service
        # context: ./services/signed-url-service
        # context: ./client/pipeline
  # IMAGE: knowledge-rag/knowledge-rag-dev/services/RAG-service-dev
  # IMAGE: knowledge-rag/knowledge-rag-dev/services/signed-url-service-dev
  # IMAGE: knowledge-rag/knowledge-rag-dev/client/pipeline-dev