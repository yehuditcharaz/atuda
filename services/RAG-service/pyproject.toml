[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ofer-knowledge-rag"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi == 0.111.0",
    "uvicorn[standard] == 0.29.0",
    "Flask == 3.1.0",
    "PyPDF2 == 3.0.1",
    "certifi == 2024.12.14",
    "flask-cors == 4.0.1",
    "flask_socketio == 5.5.1",
    "google-cloud-aiplatform == 1.77.0",
    "langchain-community == 0.3.14 ",
    "langchain-core == 0.3.29",
    "langchain-google-vertexai == 2.0.11",
    "langchain-text-splitters == 0.3.5",
    "lxml == 5.3.0",
    "matplotlib == 3.10.0",
    "nltk == 3.9.1",
    "numpy == 1.26.4",
    "opencv-python ==  4.10.0.84",
    "pathlib == 1.0.1",
    "pdf2image == 1.17.0",
    "pdfminer.six == 20231228",
    "pillow == 11.1.0",
    "pi_heif==0.21.0",
    "pydantic == 2.9.2",
    "pypdf == 5.1.0",
    "pytesseract == 0.3.13",
    "python-docx == 1.1.2",
    "python-dotenv == 1.0.1",
    "requests == 2.32.3",
    "scikit-learn == 1.6.1",
    "sentence_transformers == 3.2.1",
    "unstructured == 0.16.14",
    "unstructured_pytesseract == 0.3.13",
    "unstructured-inference == 0.8.2"
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "pytest_mock==3.14",
]
lint = [
  "black==25.1.0",
  "ruff==0.9.6",
  "pre-commit==4.1"
]
[tool.ruff]
exclude = [
    "blueprints/function_calling_blueprint.py",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
