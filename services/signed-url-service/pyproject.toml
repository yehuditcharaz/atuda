[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ofer-knowledge-rag"
version = "2025.1"
requires-python = ">=3.10"
dependencies = [
    "certifi == 2024.12.14",
    "Flask == 3.1.0",
    "flask-cors == 4.0.1",
    "google-cloud-storage == 3.0.0",
    "google-auth == 2.38.0",
    "nltk == 3.9.1",
    "python-dotenv == 1.0.1",
    "requests == 2.32.3",
    "urllib.parse == 3.13.2"
]
[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "ruff==0.8.6",
    "pre-commit==4.0.1"
]

[tool.setuptools.packages.find]
where = ["src"]
